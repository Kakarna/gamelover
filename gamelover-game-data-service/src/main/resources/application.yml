server:
  port: 8082

spring:
  config:
    import: optional:nacos:127.0.0.1:8848
  application:
    name: gamelover-game-data-service
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        namespace: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gamelover?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: gamelover
    password: gamelover123
  data:
    mongodb:
      uri: mongodb://admin:gamelover123@localhost:27017/gamelover?authSource=admin
  redis:
    host: localhost
    port: 6379
    database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

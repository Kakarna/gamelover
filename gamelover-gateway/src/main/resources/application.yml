server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gamelover-gateway
  profiles:
    active: dev
  config:
    import: optional:nacos:127.0.0.1:8848
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        namespace: dev
      config:
        enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: gamelover-user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/${segment}
        - id: gamelover-game-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/game-data/**,/api/announcement/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/${segment}
        - id: gamelover-sync-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/sync/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/v1/${segment}